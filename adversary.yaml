name: web/nextjs
version: 0.0.5
description: Reviews Next.js configuration for unsafe remote content, exposed source maps, and permissive origins.

triggers:
  manual: true
  files_changed:
    - "next.config.js"
    - "next.config.mjs"
    - "next.config.ts"
    - "**/next.config.js"
    - "**/next.config.mjs"
    - "**/next.config.ts"
    - "middleware.ts"
    - "middleware.js"
    - "**/middleware.ts"
    - "**/middleware.js"
    - "package.json"
    - "**/*.tsx"
    - "**/*.ts"

detection:
  files:
    - "next.config.js"
    - "next.config.mjs"
    - "next.config.ts"
    - "**/next.config.js"
    - "**/next.config.mjs"
    - "**/next.config.ts"
    - "middleware.ts"
    - "middleware.js"
    - "**/middleware.ts"
    - "**/middleware.js"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
